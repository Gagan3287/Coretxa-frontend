name: cortexa

services:
  cortexa-test-db:
    image: pgvector/pgvector:pg16
    container_name: cortexa-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cortexa_test
      POSTGRES_DB: cortexa_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cortexa_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  cortexa-test-redis:
    image: redis:7-alpine
    container_name: cortexa-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
